name: build-from-zip

# Кладёшь zip с исходниками мода в репозиторий -> получаешь готовый jar.
on:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write   # для создания релиза с jar

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1

      - name: Распаковать zip
        run: |
          set -e
          ZIP=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$ZIP" ]; then echo "::error::В корне репозитория нет .zip"; exit 1; fi
          echo "Беру архив: $ZIP"
          rm -rf _work && mkdir _work
          unzip -q "$ZIP" -d _work
          MOD_JSON=$(find _work -path '*src/main/resources/fabric.mod.json' | head -n 1)
          if [ -z "$MOD_JSON" ]; then echo "::error::В zip не найден src/main/resources/fabric.mod.json"; exit 1; fi
          ROOT=$(dirname "$(dirname "$(dirname "$(dirname "$MOD_JSON")")")")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "MOD_ID=$(jq -r .id "$MOD_JSON")" >> "$GITHUB_ENV"
          echo "MOD_VERSION=$(jq -r .version "$MOD_JSON")" >> "$GITHUB_ENV"

      - name: Создать файлы сборки (если их нет в zip)
        run: |
          set -e
          cd "$ROOT"
          if [ ! -f build.gradle ]; then
            cat > gradle.properties <<'EOF2'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true
          minecraft_version=26.3
          loader_version=0.19.5
          loom_version=1.18.2
          fabric_api_version=0.161.0+26.3
          EOF2
            sed -i 's/^          //' gradle.properties

            cat > settings.gradle <<'EOF2'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'mod'
          EOF2
            sed -i 's/^          //' settings.gradle

            cat > build.gradle <<'EOF2'
          plugins {
              id 'net.fabricmc.fabric-loom' version "${loom_version}"
          }

          base.archivesName = System.getenv('MOD_ID') ?: 'mod'
          version = System.getenv('MOD_VERSION') ?: '0.0.0'

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              implementation "net.fabricmc:fabric-loader:${project.loader_version}"
              implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_25
              targetCompatibility = JavaVersion.VERSION_25
              withSourcesJar()
          }

          tasks.withType(JavaCompile).configureEach {
              options.encoding = 'UTF-8'
              options.release = 25
          }
          EOF2
            sed -i 's/^          //' build.gradle
          fi

      - name: Сборка
        run: gradle build --no-daemon -p "$ROOT"

      - name: Собрать jar в папку out
        run: |
          mkdir -p out
          cp "$ROOT"/build/libs/*.jar out/
          rm -f out/*-sources.jar out/*-dev.jar
          ls -la out

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_ID }}-jar
          path: out/*.jar

      - name: Релиз со скачиваемым jar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ env.MOD_ID }} ${{ env.MOD_VERSION }} (сборка ${{ github.run_number }})
          files: out/*.jar
